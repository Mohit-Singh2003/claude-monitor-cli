[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-monitor-cli"
version = "4.0.1"
description = "A beautiful, interactive terminal monitor for Claude AI usage — real-time quotas, burn rate, cost analytics, and ML predictions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mohit Singh", email = "mohitucsss@gmail.com" }]
keywords = ["claude", "anthropic", "token", "monitor", "usage", "terminal", "tui", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Mohit-Singh2003/claude-monitor-cli"
Repository = "https://github.com/Mohit-Singh2003/claude-monitor-cli"
Issues = "https://github.com/Mohit-Singh2003/claude-monitor-cli/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[project.scripts]
claude-monitor = "claude_monitor_tool.cli:main"
cmonitor = "claude_monitor_tool.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_monitor_tool"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
